# vim: set syntax=tmux:
set -g default-shell /bin/zsh                                                                       # default zsh
set -g set-titles on                                                                                # see below
set -g set-titles-string "#T"                                                                       # pane_title name
set -g prefix C-a                                                                                   # use ctrl-a instead of ctrl-b
set -g default-terminal "$TERM"                                                                     # set default-terminal from env
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:Tc"                                                              # terminal supports true color
set -g base-index 1                                                                                 # start tab numbering at 1
set -g renumber-windows on                                                                          # renumber tabs when one is closed
set -g history-limit 50000                                                                          # increase history limit
set -g status-interval 5                                                                            # refresh status line every 5 seconds (default 15)
set -g status-keys emacs                                                                            # use emacs style key bindings in the status line
set -g focus-events on                                                                              # enable focus events

# window options
set-option -w -g allow-rename on                                                                    # allow programs to change the window name
# window notifications
set-option -w -g monitor-activity off
set -g visual-activity off


### MOUSE #######################################################################
set -g mouse                                                                                        # enable mouse support
# enable pre 2.1 default behaviour - enter copy mode when scrolling up
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"


### KEY BINDINGS ######""""""""""""""""""""##########################################################
# open new windows in cwd
bind c new-window -c '#{pane_current_path}'

# splits
# horizontal and vertical splits opens in cwd
unbind |
bind | split-window -h -c '#{pane_current_path}'
unbind _
bind _ split-window -c '#{pane_current_path}'
# open small pane at bottom
unbind ^T
bind ^T split-window -p 25 -c '#{pane_current_path}'

# go to beginning of line (ctrl-a default behaviour)
bind a send-prefix

# tile all windows
unbind =
bind = select-layout tiled

# resizing
unbind Right
bind Right resize-pane -R 8
unbind Left
bind Left resize-pane -L 8
unbind Up
bind Up resize-pane -U 4
unbind Down
bind Down resize-pane -D 4

# go to previous window - b for back (prefix b b for going back two windows)
unbind b
bind -r b previous-window -t :+
# go to "next next" window with prefix n n - req. `repeat-time` > 0
bind -r n select-window -t :+

# kill
unbind k
bind k confirm-before "kill-window"
unbind ^x
bind ^x kill-pane

### PLUGINS #####################################################################

# search entire file system - fzf-locate (alt-`)
bind-key -n 'M-`' run "tmux split-window -p 40 'tmux send-keys -t #{pane_id} \"$(locate / | fzf -m | paste -sd\\  -)\"'"

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'
run '~/.config/tmux/plugins/tpm/tpm'

set -g @plugin 'tmux-plugins/tpm'                                                                   # tmux plugin manager
set -g @plugin 'tmux-plugins/tmux-yank'                                                             # vi style copying to system clipboard
set -g @plugin 'tmux-plugins/tmux-open'                                                             # open link under copy mode selection
set -g @plugin 'tmux-plugins/tmux-resurrect'                                                        # persists tmux environment across system restarts.

# initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'



### STATUS LINE #####################################################################################
# powerline glyphs
ROUNDED_LEFT="#(printf \ue0b6)"
ROUNDED_RIGHT="#(printf \ue0b4)"

# nord based colours
set -g status-style bg=#3b4252

set -g status-left-length 32
set -g status-right-length 32

RL_BG="#81a1c1"
RL_FG="#2e3440"
set -g status-left "#[bg=${RL_BG},fg=${RL_FG}] #{session_name} #[bg=default,fg=default] "
set -g status-right " #[bg=${RL_BG},fg=${RL_FG}] #{host_short} "

WS_BG="#4c566a"
WS_FG="#81a1c1"
set -g window-status-format "#[bg=default,FG=${WS_BG}]${ROUNDED_LEFT}#[bg=${WS_BG},fg=${WS_FG}]#I #W #F#[bg=default,FG=${WS_BG}]${ROUNDED_RIGHT}"

WSC_BG="#bf616a"
WSC_FG="#eceff4"
set -g window-status-current-format "#[bg=default,FG=${WSC_BG}]${ROUNDED_LEFT}#[bg=${WSC_BG},fg=${WSC_FG}]#I #W #F#[bg=default,FG=${WSC_BG}]${ROUNDED_RIGHT}"


#set-option -g window-status-separator " "
